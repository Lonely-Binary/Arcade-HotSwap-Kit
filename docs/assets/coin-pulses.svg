<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360" role="img" aria-labelledby="title desc">
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#18364a}.title{font-size:26px;font-weight:700}.label{font-size:18px}.small{font-size:15px}.box{fill:#edf6f6;stroke:#31888d;stroke-width:2}.line{fill:none;stroke:#31888d;stroke-width:3}</style>
<rect width="1000" height="360" rx="16" fill="#fff"/>
<title id="title">One coin, two pulses</title><desc id="desc">A normally high signal falls twice. Two falling edges, separated by less than 200 milliseconds, form one group. After 200 milliseconds without another edge the group is reported.</desc>
<text x="40" y="48" class="title">One coin can produce several pulses</text>
<text x="40" y="111" class="label">HIGH</text><text x="40" y="198" class="label">LOW</text>
<path d="M125 105 H215 V190 H275 V105 H375 V190 H435 V105 H945" fill="none" stroke="#31888d" stroke-width="5"/>
<circle cx="215" cy="105" r="7" fill="#e66b42"/><circle cx="375" cy="105" r="7" fill="#e66b42"/>
<text x="188" y="229" class="small">Edge 1</text><text x="348" y="229" class="small">Edge 2</text>
<path d="M375 250 H755 M375 242 V258 M755 242 V258" class="line"/>
<text x="447" y="278" class="label">200 ms with no new edge</text>
<rect x="750" y="294" width="205" height="40" rx="8" class="box"/>
<text x="769" y="320" class="label">Report: 2 pulses</text>
<text x="40" y="326" class="small">Timing illustration; not to scale.</text></svg>