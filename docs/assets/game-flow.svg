<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360" role="img" aria-labelledby="title desc">
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#18364a}.title{font-size:26px;font-weight:700}.label{font-size:18px}.small{font-size:15px}.box{fill:#edf6f6;stroke:#31888d;stroke-width:2}.line{fill:none;stroke:#31888d;stroke-width:3}</style>
<rect width="1000" height="360" rx="16" fill="#fff"/>
<title id="title">Credit game flow</title><desc id="desc">Insert a learned coin to earn credit, press KEY1 to spend a credit and start a round, press KEY2 to score, then finish after ten seconds.</desc>
<text x="40" y="48" class="title">From a coin to a game</text>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6" fill="#31888d"/></marker></defs>
<g class="box"><rect x="35" y="110" width="200" height="115" rx="12"/><rect x="280" y="110" width="200" height="115" rx="12"/><rect x="525" y="110" width="200" height="115" rx="12"/><rect x="770" y="110" width="200" height="115" rx="12"/></g>
<g text-anchor="middle"><text x="135" y="150" class="title">INSERT COIN</text><text x="135" y="189" class="label">Verified pulse group</text><text x="380" y="150" class="title">READY</text><text x="380" y="189" class="label">KEY1 spends 1 credit</text><text x="625" y="150" class="title">PLAY</text><text x="625" y="189" class="label">KEY2 adds 1 point</text><text x="870" y="150" class="title">RESULT</text><text x="870" y="189" class="label">Round ends at 10 s</text></g>
<g class="line" marker-end="url(#arrow)"><path d="M237 168 H270"/><path d="M482 168 H515"/><path d="M727 168 H760"/><path d="M870 227 V290 H380 V235"/></g>
<text x="485" y="325" class="label">Next round requires a credit</text></svg>