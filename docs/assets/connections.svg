<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="460" viewBox="0 0 1000 460" role="img" aria-labelledby="title desc">
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#18364a}.title{font-size:26px;font-weight:700}.label{font-size:18px}.small{font-size:15px}.box{fill:#edf6f6;stroke:#31888d;stroke-width:2}.line{fill:none;stroke:#31888d;stroke-width:3}</style>
<rect width="1000" height="460" rx="16" fill="#fff"/>
<title id="title">Kit connections</title><desc id="desc">USB-C supplies the mainboard. Buttons and joystick connect to two-pin inputs, the coin acceptor to the four-pin connector, the MCU adapter to the 26-pin header and an optional display to the FPC.</desc>
<rect width="1000" height="460" fill="#fff"/>
<text x="40" y="48" class="title">Connect to the labels on the mainboard</text>
<g class="box"><rect x="360" y="150" width="280" height="180" rx="12"/><rect x="40" y="110" width="235" height="80" rx="10"/><rect x="40" y="285" width="235" height="80" rx="10"/><rect x="725" y="110" width="235" height="80" rx="10"/><rect x="725" y="285" width="235" height="80" rx="10"/></g>
<g text-anchor="middle"><text x="500" y="226" class="title">MAINBOARD</text><text x="500" y="268" class="label">USB-C: 5 V power</text><text x="157" y="143" class="label">10 buttons</text><text x="157" y="172" class="small">KEY1–KEY10 · two-wire leads</text><text x="157" y="319" class="label">Joystick</text><text x="157" y="347" class="small">UP / DOWN / LEFT / RIGHT</text><text x="842" y="143" class="label">MCU + matching adapter</text><text x="842" y="172" class="small">26-pin header</text><text x="842" y="319" class="label">Coin acceptor</text><text x="842" y="347" class="small">4-pin cable · 12 V from board</text><text x="500" y="395" class="label">Optional display</text><text x="500" y="425" class="small">15-pin FPC · verify pinout and controller</text></g>
<g class="line"><path d="M275 150 H315 V195 H360"/><path d="M275 325 H315 V280 H360"/><path d="M640 195 H680 V150 H725"/><path d="M640 280 H680 V325 H725"/><path d="M500 330 V365"/></g></svg>